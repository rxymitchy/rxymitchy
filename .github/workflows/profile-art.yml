name: Refresh profile art

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  draw:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the contribution calendar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api graphql -f query='query { user(login: "rxymitchy") { contributionsCollection { contributionCalendar { totalContributions weeks { contributionDays { contributionCount date } } } } } }' > calendar.json

      - name: Draw the charts
        run: python .github/scripts/activity_graph.py calendar.json dist/activity.svg dist/contrib-snake.svg

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile graphs"
          file_pattern: dist/*
